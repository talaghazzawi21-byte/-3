$('#root').innerHTML=`<div class="au"><div class="l"><div style="font-size:44px;font-weight:900">وِزان ⚖️</div><p style="font-size:22px;color:#A9C9E8">رتّب مهامك، وتوقّع ضغطك، ووازن حياتك.</p><p style="color:#c9daee;max-width:420px">وِزان يجمع واجباتك واختباراتك ومشاريعك في مكان واحد، ويكتشف فترات الضغط قبل وقوعها، ويبني لك خطة أسبوعية متوازنة.</p></div><div class="r"><form onsubmit="return false" class="g">${m=='nm'?`<h1>أهلًا بك في وِزان</h1><p class="sub">ما اسمك؟ سنفتح لك حسابك مباشرة.</p>${f('اسمك','nm','text','placeholder="مثال: أحمد" autofocus')}<p class="err" id="er"></p><button class="btn" onclick="quick(0)">ابدأ</button><button class="btn s" onclick="quick(1)">ابدأ ببيانات تجريبية</button><div class="fl" style="margin:0"><button class="btn sm s" onclick="auth('in')">تسجيل الدخول بالبريد</button><button class="btn sm s" onclick="auth('up')">حساب كامل</button></div>`:m=='in'?`<h1>تسجيل الدخول</h1>${f('البريد الإلكتروني','e','email')}${f('كلمة المرور','p','password')}<p class="err" id="er"></p><button class="btn" onclick="login()">دخول</button><button class="btn s" onclick="demoLogin()">جرّب الحساب التجريبي</button><div class="fl" style="margin:0"><button class="btn sm s" onclick="auth()">رجوع</button><button class="btn sm s" onclick="auth('up')">إنشاء حساب</button><button class="btn sm s" onclick="auth('fg')">نسيت كلمة المرور؟</button></div>`:m=='up'?`<h1>إنشاء حساب</h1><div class="fm">${f('الاسم','n')}${f('البريد','e','email')}${f('كلمة المرور (6+)','p','password')}${f('الجامعة','u')}${f('التخصص','j')}<div><label>المستوى</label><select id="l">${[1,2,3,4,5,6,7,8].map(x=>`<option>المستوى ${x}</option>`).join('')}</select></div><div class="w">${f('موادك الحالية (افصل بفاصلة)','c','text','placeholder="هياكل البيانات، الإحصاء"')}</div>${f('ساعات المذاكرة المتاحة يوميًا','h','number','value=4 min=0 max=16')}</div><p class="err" id="er"></p><button class="btn" onclick="signup()">إنشاء الحساب</button><button class="btn s" onclick="auth()">لدي حساب</button>`:`<h1>استعادة كلمة المرور</h1>${f('البريد الإلكتروني','e','email')}<p class="err" id="er"></p><button class="btn" onclick="$('#er').style.color='var(--ok)';$('#er').textContent='إن وُجد حساب بهذا البريد ستصلك رسالة (يتطلب تفعيل Supabase Auth لإرسال البريد فعليًا).'">أرسل الرابط</button><button class="btn s" onclick="auth()">رجوع</button>`}</form></div></div>`}
function login(){const u=DB.users[$('#e').value.trim().toLowerCase()];if(!u||u.pass!=$('#p').value)return $('#er').textContent='البريد أو كلمة المرور غير صحيحة.';DB.cur=u.profile.email;S=u;save();render()}
function signup(){const g=x=>$('#'+x).value.trim(),e=g('e').toLowerCase();if(!g('n')||!/^\S+@\S+\.\S+$/.test(e)||g('p').length<6)return $('#er').textContent='أدخل الاسم وبريدًا صحيحًا وكلمة مرور من 6 أحرف على الأقل.';if(DB.users[e])return $('#er').textContent='هذا البريد مسجل مسبقًا.';
const h=Math.max(0,+g('h')||4);DB.users[e]={profile:{name:g('n'),email:e,uni:g('u')||'—',major:g('j')||'—',level:g('l')},pass:g('p'),courses:g('c')?g('c').split(/[,،]/).map(x=>x.trim()).filter(Boolean):[],tasks:[],cap:Array(7).fill(h),plan:[],seen:[],stale:false,nid:0};DB.cur=e;S=DB.users[e];save();V='tasks';render();toast('مرحبًا بك! أضف أول مهمة لتبدأ')}
function render(){applyTheme();if(!S)return auth();if(!render.i){render.i=1;const h=location.hash.slice(1);if(VW[h])V=h}try{if(location.hash.slice(1)!=V)history.replaceState(null,'','#'+V)}catch(e){}const mn=VW[V]();$('#root').innerHTML=`<div class="top"><button onclick="$('aside').classList.toggle('open')" aria-label="القائمة" style="width:28px">${ic('menu')}</button><b style="font-size:20px">وِزان ⚖️ ${flame()}</b><span style="position:relative"><button onclick="bell()" aria-label="الإشعارات" style="width:26px">${ic('bell')}</button></span></div><aside><div class="logo">⚖️ وِزان<small>رتّب · توقّع · وازن</small></div>${NAV.map(n=>`<button class="nv ${V==n[0]?'on':''}" onclick="go('${n[0]}')">${ic(n[0])}${n[1]}</button>`).join('')}<div class="usr">${esc(S.profile.name)} ${flame()}<br><span style="color:var(--l)">${esc(S.profile.major)}</span></div></aside><main><div style="position:relative;height:0"><div id="np" style="position:absolute;left:0;top:0"></div></div><div style="text-align:left" class="mb">${V!='home'?'<button class="btn s sm" style="float:right" onclick="goBack()">→ رجوع</button>':''}<span style="position:relative;display:inline-block"><button class="btn s sm" onclick="bell()">🔔 الإشعارات</button>${nots().filter(x=>!S.seen.includes(x[0])).length?`<span class="bdg" id="bg">${nots().filter(x=>!S.seen.includes(x[0])).length}</span>`:''}</span></div>${mn}</main><button class="fab" onclick="openTask()">${ic('plus').replace('<svg','<svg width="20" height="20" fill="none" stroke="#fff" stroke-width="2.5"')}مهمة جديدة</button><div id="md"></div>`;paintAI();fzPaint()}
  render();
</script></body></html>
